services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: finrag-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro

volumes:
  postgres_data:
