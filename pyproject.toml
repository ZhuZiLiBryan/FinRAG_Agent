[project]
name = "finrag-agent"
version = "0.1.0"
description = "RAG Agent for Financial Questions"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "sentence-transformers>=6.2.0",
    "typing-extensions>=4.16.0",
    "torch",
]

[project.scripts]
finrag-agent = "finrag_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
