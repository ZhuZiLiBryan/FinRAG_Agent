[project]
name = "finrag-agent"
version = "0.1.0"
description = "RAG Agent for Financial Questions"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "datasets>=5.1.0",
]

[project.scripts]
finrag-agent = "finrag_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
